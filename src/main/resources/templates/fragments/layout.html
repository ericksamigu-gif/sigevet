<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- ==========================================================================
     FRAGMENT: HEAD
     ========================================================================== -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">SIGEVET - Sistema Veterinario</title>

    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Hoja de Estilos Centralizada de SIGEVET -->
    <link rel="stylesheet" th:href="@{/css/sigevet.css}">

    <!-- Estilo global para campos obligatorios en rojo -->
    <style>
        label .required, label .text-danger, .required-asterisk, span.required {
            color: #ef4444 !important;
            font-weight: 800 !important;
            font-size: 1.1em !important;
            margin-left: 2px !important;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            function resaltarAsteriscos() {
                document.querySelectorAll("label").forEach(function(lbl) {
                    if (lbl.innerHTML.includes("*") && !lbl.querySelector(".required")) {
                        lbl.innerHTML = lbl.innerHTML.replace(/\s*\*/g, ' <span class="required" style="color:#ef4444; font-weight:800;">*</span>');
                    }
                });
            }
            resaltarAsteriscos();
            document.addEventListener("click", function(e) {
                if (e.target.closest("button") || e.target.closest("a")) {
                    setTimeout(resaltarAsteriscos, 150);
                }
            });
        });
    </script>
</head>

<body>

<!-- ==========================================================================
     FRAGMENT: SIDEBAR (PERSISTENTE)
     ========================================================================== -->
<aside class="sidebar" th:fragment="sidebar(activeItem)">
    <!-- Cabecera de Marca -->
    <div class="brand-header">
        <div class="brand-icon">🐾</div>
        <div>
            <div class="brand-title">SIGEVET</div>
            <div class="brand-subtitle">Gestión Veterinaria</div>
        </div>
    </div>

    <!-- Botón de acción principal adaptativo -->
    <button th:if="${activeItem == 'clientes'}" class="btn-action-primary" onclick="abrirModalCrear()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Nuevo Cliente
    </button>
    <button th:if="${activeItem == 'mascotas'}" class="btn-action-primary" onclick="abrirModalCrear()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Nueva Mascota
    </button>
    <button th:if="${activeItem == 'citas'}" class="btn-action-primary" onclick="abrirModalCrear()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Nueva Cita
    </button>
    <button th:if="${activeItem == 'historial' and ((usuario != null and usuario.rol != 'RECEPCIONISTA') or (session.usuario != null and session.usuario.rol != 'RECEPCIONISTA'))}" class="btn-action-primary" onclick="abrirModalCrear()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Nueva Atención
    </button>
    <a th:if="${activeItem != 'clientes' and activeItem != 'mascotas' and activeItem != 'citas' and activeItem != 'historial' and activeItem != 'reportes'}" href="/citas" class="btn-action-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Nueva Cita
    </a>

    <!-- Menú de Navegación -->
    <ul class="nav-menu">
        <li>
            <a href="/" class="nav-link" th:classappend="${activeItem == 'inicio' ? 'active' : ''}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Inicio
            </a>
        </li>
        <li>
            <a href="/clientes" class="nav-link" th:classappend="${activeItem == 'clientes' ? 'active' : ''}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                Clientes
            </a>
        </li>
        <li>
            <a href="/mascotas" class="nav-link" th:classappend="${activeItem == 'mascotas' ? 'active' : ''}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                    <line x1="9" y1="9" x2="9.01" y2="9"></line>
                    <line x1="15" y1="9" x2="15.01" y2="9"></line>
                </svg>
                Mascotas
            </a>
        </li>
        <li>
            <a href="/citas" class="nav-link" th:classappend="${activeItem == 'citas' ? 'active' : ''}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                Citas
            </a>
        </li>
        <li>
            <a href="/historial" class="nav-link" th:classappend="${activeItem == 'historial' ? 'active' : ''}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
                Historial
            </a>
        </li>
        <li>
            <a href="/reportes" class="nav-link" th:classappend="${activeItem == 'reportes' ? 'active' : ''}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
                Reportes
            </a>
        </li>
        <li th:if="${(usuario != null and usuario.rol == 'ADMINISTRADOR') or (session.usuario != null and session.usuario.rol == 'ADMINISTRADOR')}">
            <a href="/usuarios" class="nav-link" th:classappend="${activeItem == 'usuarios' ? 'active' : ''}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M12 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"></path>
                    <path d="M4 20v-1a7 7 0 0 1 14 0v1"></path>
                    <path d="M18 8a3 3 0 1 0 0 6"></path>
                    <path d="M22 20v-1a5 5 0 0 0-4-4.8"></path>
                </svg>
                Usuarios
            </a>
        </li>
    </ul>

    <!-- Pie de Barra Lateral -->
    <div class="sidebar-footer">
        <a href="/logout" class="nav-link link-logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Cerrar Sesión
        </a>
    </div>
</aside>


<!-- ==========================================================================
     FRAGMENT: TOP NAVBAR
     ========================================================================== -->
<header class="top-navbar" th:fragment="topbar(searchPlaceholder)">
    <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="globalSearch" 
               th:placeholder="${searchPlaceholder != null ? searchPlaceholder : 'Buscar...'}" 
               oninput="if(typeof filtrarGlobal === 'function') filtrarGlobal(this.value)">
    </div>

    <div class="navbar-user-area">
        <!-- Indicador de token (mantenido en comentario según configuración del usuario) -->
        <!-- <div class="token-status" title="Autenticación con JWT activa">
            <div class="dot"></div>
            Token Activo
        </div> -->

        <div class="user-profile-badge">
            <div class="user-avatar" id="avatarIniciales">
                <span th:if="${usuario != null and usuario.nombre != null and usuario.apellido != null and #strings.length(usuario.nombre) > 0 and #strings.length(usuario.apellido) > 0}" 
                      th:text="${#strings.substring(usuario.nombre,0,1) + #strings.substring(usuario.apellido,0,1)}">US</span>
                <span th:unless="${usuario != null and usuario.nombre != null and usuario.apellido != null and #strings.length(usuario.nombre) > 0 and #strings.length(usuario.apellido) > 0}">US</span>
            </div>
            <div class="user-info">
                <div class="user-name" th:if="${usuario != null}" th:text="${usuario.nombre + ' ' + usuario.apellido}">Usuario</div>
                <div class="user-name" th:if="${usuario == null}">Usuario Invitado</div>
                <div class="user-role" th:if="${usuario != null}">
                    <span class="badge-role" 
                          th:classappend="${usuario.rol == 'ADMINISTRADOR' ? 'badge-role-admin' : (usuario.rol == 'VETERINARIO' ? 'badge-role-vet' : 'badge-role-rec')}"
                          th:text="${usuario.rol}">Personal</span>
                </div>
                <div class="user-role" th:if="${usuario == null}">
                    <span class="badge-role badge-role-rec">Invitado</span>
                </div>
            </div>
        </div>
    </div>
</header>


<!-- ==========================================================================
     FRAGMENT: TOAST CONTAINER
     ========================================================================== -->
<div class="toast-container" id="toastContainer" th:fragment="toastContainer">
    <script th:inline="javascript">
        if (typeof window.mostrarToast !== 'function') {
            window.mostrarToast = function(mensaje, tipo = "info") {
                const container = document.getElementById('toastContainer');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = `toast-notif toast-${tipo}`;
                let icono = 'ℹ️';
                if (tipo === 'success') icono = '✅';
                if (tipo === 'error') icono = '⚠️';
                toast.innerHTML = `<span style="font-size:16px;">${icono}</span> <span>${mensaje}</span>`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(10px)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, 4000);
            };
        }
    </script>
</div>

</body>
</html>
