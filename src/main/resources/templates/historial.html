<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Historial Médico - SIGEVET')}"></head>

<body>

<div class="app-layout">

    <!-- ================= BARRA LATERAL (PERSISTENTE) ================= -->
    <aside th:replace="~{fragments/layout :: sidebar('historial')}"></aside>

    <!-- ================= CONTENIDO PRINCIPAL ================= -->
    <div class="main-wrapper">

        <!-- BARRA SUPERIOR -->
        <header th:replace="~{fragments/layout :: topbar('Buscar en historial médico...')}"></header>

        <!-- CUERPO DE LA PÁGINA -->
        <main class="content-body">

            <div class="page-header-row">
                <div class="page-title-group">
                    <h1>Historial Médico y Consultas</h1>
                    <p style="color:#64748b; font-size:14px; margin-top:4px;">Registro de atenciones, diagnósticos, tratamientos y recetas de los pacientes.</p>
                </div>
            </div>

            <div class="data-card">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>FECHA</th>
                                <th>DIAGNÓSTICO</th>
                                <th>TRATAMIENTO</th>
                                <th>VACUNAS</th>
                                <th>ALERGIAS</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="atencion : ${atenciones}">
                                <td th:text="${atencion.id}"></td>
                                <td th:text="${atencion.fecha}"></td>
                                <td><strong th:text="${atencion.diagnostico}"></strong></td>
                                <td th:text="${atencion.tratamiento}"></td>
                                <td th:text="${atencion.vacunas}"></td>
                                <td th:text="${atencion.alergias}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(atenciones)}">
                                <td colspan="6" style="text-align:center; padding:30px; color:#94a3b8;">No hay registros de atenciones médicas registradas</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

    </div>

</div>

</body>
</html>
