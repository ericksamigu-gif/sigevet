<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIGEVET - Panel Principal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f8;
            color: #222;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* BARRA LATERAL */
        .sidebar {
            width: 250px;
            background: #0f3d3e;
            color: white;
            padding: 30px 20px;
        }

        .sidebar h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .sidebar p {
            color: #b9dddd;
            margin-bottom: 50px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 15px;
        }

        .menu a {
            display: block;
            text-decoration: none;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 18px;
        }

        .menu a:hover,
        .menu .active {
            background: #1d7373;
        }

        /* CONTENIDO */
        .content {
            flex: 1;
        }

        /* CABECERA */
        .header {
            height: 105px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .header h2 {
            font-size: 34px;
            color: #222;
        }

        .user {
            background: #e8f2f2;
            color: #0f3d3e;
            padding: 15px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
        }

        /* CONTENIDO PRINCIPAL */
        .main {
            padding: 45px;
        }

        .welcome {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 35px;
        }

        .welcome h2 {
            color: #0f3d3e;
            margin-bottom: 12px;
            font-size: 26px;
        }

        .welcome p {
            color: #607d8b;
            font-size: 18px;
            line-height: 1.5;
        }

        .role {
            margin-top: 10px;
        }

        .role strong {
            color: #0f3d3e;
        }

        /* TARJETAS */
        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .card h3 {
            color: #607d8b;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .card .number {
            font-size: 42px;
            font-weight: bold;
            color: #0f3d3e;
        }

        /* RESPONSIVE */
        @media (max-width: 1000px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 700px) {
            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 20px;
            }

            .main {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- BARRA LATERAL -->
    <aside class="sidebar">

        <h1>SIGEVET</h1>

        <p>Gestión veterinaria</p>

        <ul class="menu">

            <li>
                <a href="/" class="active">Inicio</a>
            </li>

            <li>
                <a href="/clientes">Clientes</a>
            </li>

            <li>
                <a href="/mascotas">Mascotas</a>
            </li>

            <li>
                <a href="/citas">Citas</a>
            </li>

            <li>
                <a href="/historial">Historial</a>
            </li>

            <li>
                <a href="#">Reportes</a>
            </li>

        </ul>

    </aside>


    <!-- CONTENIDO -->
    <div class="content">

        <!-- CABECERA -->
        <header class="header">

            <h2>Panel principal</h2>

            <div class="user">

                <span th:if="${usuario != null}"
                      th:text="${usuario.nombre + ' ' + usuario.apellido}">
                </span>

                <span th:if="${usuario == null}">
                    Usuario
                </span>

            </div>

        </header>


        <!-- CONTENIDO PRINCIPAL -->
        <main class="main">

            <!-- BIENVENIDA -->
            <section class="welcome">

                <h2 th:if="${usuario != null}">
                    Bienvenido,
                    <span th:text="${usuario.nombre + ' ' + usuario.apellido}">
                    </span>
                </h2>

                <p th:if="${usuario != null}" class="role">
                    Rol:
                    <strong th:text="${usuario.rol}"></strong>
                </p>

                <p>
                    Sistema de Gestión Integral y Automatización de Procesos
                    para Clínicas Veterinarias.
                </p>

            </section>


            <!-- TARJETAS -->
            <section class="cards">

                <div class="card">

                    <h3>Clientes</h3>

                    <div class="number">
                        0
                    </div>

                </div>


                <div class="card">

                    <h3>Mascotas</h3>

                    <div class="number">
                        0
                    </div>

                </div>


                <div class="card">

                    <h3>Citas de hoy</h3>

                    <div class="number">
                        0
                    </div>

                </div>


                <div class="card">

                    <h3>Atenciones</h3>

                    <div class="number">
                        0
                    </div>

                </div>

            </section>

        </main>

    </div>

</div>

</body>

</html>
