<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Citas - SIGEVET</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7f8;
            color: #222;
        }

        .header {
            background: white;
            padding: 25px 40px;
            border-bottom: 1px solid #ddd;
        }

        .header h1 {
            margin: 0;
            color: #0f3d3e;
        }

        .container {
            padding: 40px;
        }

        .volver {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: white;
            background: #0f3d3e;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .form-container,
        .table-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .form-container h2 {
            color: #0f3d3e;
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .btn-guardar {
            margin-top: 20px;
            padding: 12px 25px;
            background: #0f3d3e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-guardar:hover {
            background: #145556;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #0f3d3e;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f1f5f5;
        }

        @media (max-width: 800px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Gestión de Citas</h1>
    </div>

    <div class="container">

        <a href="/" class="volver">
            ← Volver al Dashboard
        </a>

        <!-- NUEVA CITA -->
        <div class="form-container" th:if="${puedeAgendar}">

    <h2>Registrar Nueva Cita</h2>

            <form action="/citas/guardar"
                  method="post"
                  th:object="${nuevaCita}">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="fecha">Fecha</label>

                        <input type="date"
                               id="fecha"
                               th:field="*{fecha}"
                               required>
                    </div>


                    <div class="form-group">
                        <label for="hora">Hora</label>

                        <input type="time"
                               id="hora"
                               th:field="*{hora}"
                               required>
                    </div>


                    <div class="form-group">
                        <label for="mascota">Mascota</label>

                        <select id="mascota"
                                th:field="*{mascota.id}"
                                required>

                            <option value="">
                                Seleccione una mascota
                            </option>

                            <option th:each="mascota : ${mascotas}"
                                    th:value="${mascota.id}"
                                    th:text="${mascota.nombre}">
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label for="veterinario">Veterinario</label>

                        <select id="veterinario"
                                th:field="*{veterinario.id}"
                                required>

                            <option value="">
                                Seleccione un veterinario
                            </option>

                            <option th:each="veterinario : ${veterinarios}"
                                    th:value="${veterinario.id}"
                                    th:text="${veterinario.nombre + ' ' + veterinario.apellido}">
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label for="motivo">Motivo</label>

                        <input type="text"
                               id="motivo"
                               th:field="*{motivo}"
                               placeholder="Ej. Consulta general"
                               required>
                    </div>


                    <div class="form-group">
                        <label for="estado">Estado</label>

                        <select id="estado"
                                th:field="*{estado}"
                                required>

                            <option value="PENDIENTE">
                                PENDIENTE
                            </option>

                            <option value="ATENDIDA">
                                ATENDIDA
                            </option>

                        </select>
                    </div>

                </div>

                <button type="submit" class="btn-guardar">
                    Guardar Cita
                </button>

            </form>

        </div>


        <!-- LISTA DE CITAS -->
        <div class="table-container">

            <h2>Citas Registradas</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Motivo</th>
                        <th>Estado</th>
                        <th>Mascota</th>
                        <th>Veterinario</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="cita : ${citas}">

                        <td th:text="${cita.id}"></td>

                        <td th:text="${cita.fecha}"></td>

                        <td th:text="${cita.hora}"></td>

                        <td th:text="${cita.motivo}"></td>

                        <td th:text="${cita.estado}"></td>

                        <td th:text="${cita.mascota != null ? cita.mascota.nombre : 'Sin mascota'}"></td>

                        <td th:text="${cita.veterinario != null ? cita.veterinario.nombre + ' ' + cita.veterinario.apellido : 'Sin veterinario'}"></td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
